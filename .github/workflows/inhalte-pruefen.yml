# Prüfregel für Ratgeber und Ersatzteil-Daten vor dem Merge (docs/SEITENAUFBAU.md, Abschnitt 6).
# Logik: scripts/pruefe-inhalte.py. Mit --streng ist Notiz-Sprache in den Ersatzteil-Daten ein Fehler.
name: inhalte-pruefen

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/pruefe-inhalte.py"
  push:
    branches: [main]
    paths:
      - "data/**"

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I scripts/pruefe-inhalte.py --streng
